【確定した世界観・会話のルール】
・プレイヤーの「守り神さま」と、案内役の「カミサマ（わし・〜じゃ）」は別。
・家具・遊具・照明などは、せいれいが初めから名前や設計を知っているものではない。
・せいれいの願い／困りごと → 守り神のひらめき → 図案をもとにせいれいが作る → 初めて使って喜ぶ。
・使った後や教わった後は名前を知ってよい。植物・属性など自然についての知識とは区別する。
・最初の草原はフタバひとり。仲間がいない時点で「みんなで」などと話させない。
・火山の村も最初はホムラひとり。各エリアで仲間が加わる前の会話に、まだいない子を含めない。
・説明の復唱ではなく、感覚や気持ちを中心に話す。前後の会話・人数・知識も確認する。
・フタバは木／ぼく、ノドカは土／ぼく・〜だねぇ、ホムラは火／あたい、シズクは水／わたし・丁寧。
・コードの POKO はフタバ、MINA はノドカ。別キャラを指す古い名前と取り違えない。
・木火水土風の5属性。暮らしを育て、土地のヌシを迎える。未解決の謎の答えを勝手に確定しない。

【進行と操作の約束】
・村レベル目標は、仲間を迎える・村を広げる・防衛するなど実際の村づくりの間に分散させる。Lv待ちの目標を短い操作だけを挟んで連続させない。
・受注とお礼は吹き出しをタップして始める。達成演出から自動でお礼を開かない。
・設置目標では、対象の近くへ歩き、喜ぶモーションの開始と同時に完了吹き出しを出す。喜びは約2.4秒続く。
・ピンクの条件会話も、対象の物や相手のそばへ1.5倍速で集まり、到着してリアクションを始めた時に吹き出しを出す。会話はタップで始め、会話後は3時間あける。
・建物・植物は完成や植え付け後。空腹・敵・夜の危険・会話中は生活と安全を優先。瞬間移動させない。
・受注／報告完了でレシピを増やす。家具の発想・作成には村Lv条件を適用しない。家具レシピは関連クエストで覚えるが、じゅうたんとカーテンのみLv9の指定報酬として解放する。各レベル報酬は設定した一覧に限る。木・果樹などの個別の設置可能Lvとは区別する。取得済みの形は重複通知しない。
・村レベル達成クエストから家具レシピをひらめかせない。家具は内容に関連する依頼をきっかけにする。
・せいれいの経験値は従来の保存分を保ち、以後の獲得量を少し抑えてレベル上昇を緩やかにする。
・火の仲間を迎えるメイン目標を受注したら、サルビア5本・見張り台合計2つの依頼を順に案内する。どちらも火の仲間を呼ぶ条件にはしない。花の属性値は種類ごとに1。属性値は依頼の受注状況にかかわらず、基地に置いた物の分を常に蓄積して召喚判定に使う。
・基地拡張は水のせいれいが来た後。その依頼を受ける会話でカミサマの像を発想する。
・精霊どうしの会話で家具・遊具・施設に触れるときは、実際に置かれてから話題にする。別属性ごとの会話にも条件を適用する。
・敵はストーリーの序盤ではゆっくり増やし、強い種類とオオカゲ撃破後の増援も段階的に出す。その夜のコワイノ全員を朝4時までに到着させる。ワナクイは罠設置でなく進行度に合わせる。
・収納は「収納」、遊具は「遊び」。依頼ボード・置く一覧・お供え箱の分類をそろえる。
・上部UIの折り返しとsafe-area、画面幅に合う指ガイドを維持する。
・開始画面に「10秒ごとに自動セーブ」「音が出ます」の案内を再追加しない。機能は残す。
・村レベルはLv10が上限。レベル報酬はLv2 あぜ道・柵のドア、Lv3 木の壁・ドア、Lv4 フローリング・窓、Lv5 しっくいの壁・砂利道、Lv6 石の塀・石の塀のドア、Lv7 丸太の壁、Lv8 レンガ道・レンガ壁、Lv9 じゅうたん・カーテン、Lv10 石畳・石の大門。丸太の柵・小さな家は新規作成と報酬から除く。竹の柵・石の柵も新規一覧から除く。

【現実装と拡張時の注意】
・通常エリアの内部IDは草原0／火山1。予告のみの水2／土3／風4／神々の庭5。フリーは6。
・未実装エリアの登場人物・ヌシ・事件・結末は未確定。予告があることと実装済みであることは別。
・現在は localStorage 保存。クラウド同期なし。JSON書き出し／読み込みあり。URLを変えると保存先も変わる。
・状態 v:8／クエスト移行 qVer:35。SAVE_KEYS、S.quest、qStory、subDone、recipes を引き継ぐ。
・クエスト順や表示文言は関連マップと保存移行にも影響する。新エリア用の保存キーを用意する。
・風の仲間 → 5属性が必要な台座の順。解放に循環依存を作らない。タブ番号を固定しない。
・objectDepth により足元で重ねる。複数マスと地面チップの描き直しを混同しない。
・現公開先はSites。GitHub Pagesではない。開発資料に認証情報を書かない。
このメモは開発資料。新しいユーザー指示・実装変更に合わせ、詳細資料と一緒に保守する。
収納の用途：普通の棚・木箱・かべ棚は素材、ひくい棚・キャビネットは食料。容量と運搬先を共通定義STORAGEで扱う。
守り神のひらめきには未公開の由来がある。制作側の真相と登場人物の知識はdocs/WORLD_BIBLE.mdを参照。ゲームに守り神の心情・独白・内面の地の文を入れない。カミサマが形を見て「それは……」と反応する間でほのめかす。カミサマも真相は知らず、形への反応と由来の理解を区別する。
道は4方向に接続し、外周だけに素材に合う縁を描く（砂利道と土の道には隣接する地面色の草・土が密に不規則に入り込む縁（硬い縁なし）、石だたみは幅広の石、レンガ道は幅広のレンガ（目地は狭く））。へこんだ内角は斜め隣も確認して素材に合うコーナーを描く。広場の内部にタイルの縁や隙間を作らない。
カミサマがプレイヤーに呼びかける二人称は「おヌシ」。「守り神さま」「そなた」と呼ばない。せいれいの呼称とは分ける。
新しい図案はideaDialogueで願いとカミサマの反応の間に光・図案の演出を挟む。守り神の心情は語らず、つづけるのタップ後に会話へ戻る。
会話はdialogueBeatとdialoguePoseで反応の動きと間、dialoguePauseで句読点の間を入れる。自動では次の台詞へ進めず、連打で動きや余韻を飛ばさない。
緑地と荒地の境界はdrawGrassBoundaryで道の縁に似た草・土のまだらな入り込みを描き、端は丸くつないで角を作らない。緑地内部・水辺には適用しない。
会話の全身立ち絵はdialogueSpiritAnimとdrawSpiritのtalk系で腕・姿勢も動かす。台詞後は待機へ戻す。
表情判定は恐怖・襲撃・悲しみを一般的な肯定語より先に見る。号泣顔は使わず、強い悲しみも両目をうるませる。片目の涙は台詞の流れに合わせて使う。食卓は葉を使う案と風で飛ぶ問題を挟んでから「土がつかず風にも飛ばされない場所」へ発想をつなげる。
ゲームのプログラムは game.js（index.html は画面のかたちと見た目だけ。最初の文字をすぐ出すため分けている）。公開時に ?v= はコミットごとに自動で書きかわる。

/* Layout: full-screen world canvas; HUD floats at the top, hotbar + dock at the bottom, sheets slide up over the world */
:root{
  --ground:#9c8f6c;
  --panel:#3d6a62; --panel2:#4d7d73; --line:#76a89c;
  --ink:#f3f8ee; --muted:#d2e6df;
  --accent:#ecdcbc; --leaf:#86d68f; --danger:#ff7b6b; --sky:#8fd3f4; --pink:#ff9cc0; --tired:#b9a7ff;
  --f-display:"Hikomi","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --f-body:"Hikomi","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --gut-l:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;display:block;touch-action:none}

.top{position:absolute;left:0;right:0;top:0;z-index:5;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:flex-start}
.hud{pointer-events:auto;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:14px;padding:6px 12px;max-width:100%;flex-wrap:wrap;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.clock{display:flex;flex-direction:row;align-items:baseline;gap:8px;line-height:1.05;min-width:54px}
.guard-btn{position:relative;width:52px;height:52px;border-radius:50%;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.35);margin-bottom:2px}
.guard-btn.tap{pointer-events:auto;cursor:pointer}.guard-btn.armed{box-shadow:0 0 0 3px #fff,0 0 14px 4px #ffe58a}.skills{align-self:flex-end;display:flex;gap:10px;pointer-events:none}.skills>*{margin-bottom:2px}
.guard-btn .gl{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.guard-btn .gl svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.guard-btn .gb{background:#8a8a8a;border-color:#c9c9c9}.guard-btn .gb svg{stroke:#e6e6e6}
.guard-btn .gc{background:radial-gradient(circle at 35% 30%,#ffe98a,#e5a92c);border-color:#fff3c4;-webkit-mask:conic-gradient(#000 var(--gp,360deg),transparent 0);mask:conic-gradient(#000 var(--gp,360deg),transparent 0)}
.clock span{font-size:12px;color:var(--muted);letter-spacing:.06em}
.clock b{font-family:var(--f-display);font-size:18px;font-weight:400;font-variant-numeric:tabular-nums}
.clock b i{display:inline-block;width:.62em;text-align:center;font-style:normal}.clock b i.c{width:.3em}
.lvb{display:flex;flex-direction:row;gap:6px;align-items:center}
/* HUD はいつも見るものだけ。村レベル・みどりなどは HUD をタップして見る */
#revLbl{display:none!important}.hud{cursor:pointer}
.lvb span,.stat span{font-size:10px;color:var(--muted);letter-spacing:.04em;line-height:1}
.lvb b{font-family:var(--f-display);font-weight:400;font-size:15px;color:var(--leaf);line-height:1}
.xp{position:relative;width:64px;height:9px;border-radius:5px;background:#2a4c47;overflow:hidden}.xp em{position:absolute;inset:0;font:700 7.5px/9px sans-serif;font-style:normal;color:#fff;text-align:center;text-shadow:0 0 2px #000}
.xp i{display:block;height:100%;background:var(--leaf);width:0}
.stat{display:flex;flex-direction:row;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;flex:none;display:block}
.ir{display:flex;align-items:center;gap:3px}
.stock{flex-basis:100%;display:flex;gap:14px;align-items:center;border-top:1px solid var(--line);padding-top:5px;margin-top:-2px}
.stk{display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.stk span{font-size:10px;color:var(--muted)}
.stk b{font-weight:800;font-size:14px;line-height:1;margin-right:2px}
.gauge{width:44px;height:6px;border-radius:3px;background:#2a4c47;overflow:hidden}
.gauge i{display:block;height:100%;width:0;background:var(--leaf);transition:width .3s}
.stat b{font-weight:800;font-size:16px;line-height:1}
#pt{color:var(--accent)}
.ic{width:16px;height:16px;display:inline-block;flex:none}
.ic.coin{border-radius:50%;background:radial-gradient(circle at 35% 35%,#f5ecd9,#cdb894 70%);box-shadow:inset 0 0 0 2px #b97c12}
.ic.star{background:var(--accent);clip-path:polygon(50% 0,62% 35%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 35%)}
.ic.food{border-radius:50% 50% 45% 45%;background:linear-gradient(#fff 0 55%,#2c3d2b 55%)}
.qrow{display:flex;gap:6px;max-width:100%;min-width:0;pointer-events:auto;align-items:center}
