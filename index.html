/* 端末の表示幅・セーフエリア内でHUDを組み直す。 */

html,body{margin:0;width:100%;min-width:0}
.top,.bottom,.hud,.stock,.stk,.qrow,.quest,.alert,.qhow{box-sizing:border-box;min-width:0}
.top,.bottom{max-width:100%}
.hud{width:min(100%,640px);gap:8px;overflow-wrap:anywhere}
.clock,.lvb{flex-wrap:wrap;min-width:0;max-width:100%}
.stock{width:100%;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px}
.stock>.stk{min-width:0;max-width:100%;flex-wrap:wrap;gap:4px}

/* A visible invention beat between a wish and the guide's response. */
.idea-reveal{position:fixed;inset:0;z-index:10001;display:grid;place-items:center;padding:24px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at center,rgba(255,227,142,.48),rgba(22,44,36,.88));overflow:hidden;animation:idea-in .45s ease both}

.wcard .wn{display:flex;align-items:center;gap:4px}.wcard .wn svg.pxi{width:14px;height:14px;fill:var(--muted)!important}
.wcard h3{font-size:22px!important}.wcard p{font-size:12px;color:#6a5640!important}
/* ---- 上の欄（ui2）：1行め 時刻・天気・村レベル、2行め パワー・せいれい・食料・素材。どれも札（わくの絵：#e9d8b4、ふちなし） ---- */
#topUI .hud{display:flex!important;flex-direction:column;align-items:stretch;gap:4px!important;padding:5px 6px!important;width:min(100%,560px)!important;flex-wrap:nowrap!important}
#topUI .hrow{display:flex;align-items:center;gap:4px;min-width:0}
#topUI .htag{--pp:1px;display:flex!important;align-items:center;gap:4px!important;padding:3px 6px!important;min-width:0;min-height:22px;box-sizing:border-box;border-radius:0!important;border-style:solid!important;border-color:transparent!important;border-width:var(--pp)!important;border-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2211%22%20height%3D%2211%22%20viewBox%3D%220%200%2011%2011%22%20shape-rendering%3D%22crispEdges%22%3E%3Cpath%20d%3D%22M4%200h3v1h-3zM2%201h7v1h-7zM1%202h9v1h-9zM1%203h9v1h-9zM0%204h11v1h-11zM0%205h11v1h-11zM0%206h11v1h-11zM1%207h9v1h-9zM1%208h9v1h-9zM2%209h7v1h-7zM4%2010h3v1h-3z%22%20fill%3D%22%23e9d8b4%22%2F%3E%3C%2Fsvg%3E") 5 fill / calc(var(--pp)*5) stretch!important;background:none!important;margin:0!important}
#topUI svg.hic{width:16px;height:16px;flex:none}
#topUI .clock{flex:none;min-width:0}#topUI .clock b{font-size:15px;line-height:1}#topUI .clock svg.hic{fill:#86715a!important}
#topUI .wxtag{flex:0 1 auto;overflow:hidden}#topUI .wxtag span{font-size:11px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:2px;letter-spacing:0}
#topUI .lvb{flex:1 1 auto;display:flex!important;flex-wrap:nowrap!important;min-width:max-content!important}/* 天気の欄が長くても、村レベルの数をはみ出させない（天気の欄のほうを「…」で切る） */
#topUI .wxtag svg.pxi{flex:none}
#topUI .lvb .ir{display:flex;align-items:center;gap:3px;flex:none}#topUI .lvb svg.hic{fill:#3f8a3d!important}#topUI .lvb b{font-size:15px;color:#3f8a3d}
#topUI .xp{flex:1 1 60px;min-width:36px;width:auto!important;height:8px!important;background:#cdb894!important;box-shadow:inset 0 0 0 1px #b39b72}
#topUI .xp i{background:#5fae55!important}
#topUI .lvb>em{font-style:normal;font-size:10px;line-height:1;color:var(--muted);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
#topUI .stock{display:grid!important;grid-template-columns:auto auto minmax(0,1fr) minmax(0,1fr);gap:4px!important;border-top:0!important;padding-top:0!important;margin-top:0!important;width:100%}
#topUI .stock>.htag{grid-column:auto!important}
#topUI .stock b{font-size:14px;line-height:1;margin:0!important;white-space:nowrap}
#topUI .stock .gauge{flex:1 1 30px!important;width:auto!important;min-width:20px;height:8px!important;background:#cdb894!important;box-shadow:inset 0 0 0 1px #b39b72}
#topUI .pxpow{fill:#d98a2b!important}#topUI .stat:nth-child(2) svg.hic{fill:#4f9e4c!important}#topUI #foodStk svg.hic{fill:#86715a!important}#topUI #matStk svg.hic{fill:#a8743f!important}
@media(max-width:380px){#topUI .lvb>em{display:none}#topUI .wxtag span{font-size:10px}}
/* 村のようすに写すアイコン */
.vl svg.hic{width:18px;height:18px;flex:none;fill:#86715a!important}
/* おく：ひらいたら、たて画面では横いっぱい。物はマス目（グリッド）にならべる */
#palette.open .pal{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:5px!important;align-content:start}
#palette.open .pallbl{grid-column:1/-1}
#palette.open .chip{width:auto!important;min-width:0}#palette.open .chip.wide{grid-column:span 2}#palette.open .chip .nm{max-width:100%}
#palette.open .palnone{grid-column:1/-1}#palette.open .palbar{flex-basis:100%;order:-2;min-width:0}.palbar{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none;padding:0 0 4px;touch-action:pan-x}.palbar::-webkit-scrollbar{display:none}.palbar .ctab{flex:0 0 auto;padding:4px 10px;font-size:12px}.palnone{padding:10px 6px}.palnone .btn{pointer-events:auto}
#followTag{pointer-events:auto;align-self:center;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 12px;font-size:12px;line-height:1.3;max-width:calc(100% - 20px)}#followTag small{font-size:10px;opacity:.8}
@media(max-width:599px){#palette.open{margin-left:-10px!important;margin-right:-10px!important}#palette.open .pal{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))!important}}
@media(max-height:500px){#palette.open .pal{max-height:max(90px,calc(100dvh - 250px))!important}}

#lvup.on .card{animation:lvpop .45s steps(1) both!important}

<!-- HAKONIWA DEVELOPMENT NOTES / 開発用設定メモ（ゲーム画面には表示しない）
作業ルールは CLAUDE.md、世界の設定（ヌシ様・コワイノの正体・さいごの章）は STORY.md を読む。
最新のユーザー指示で設定が変わったら、このメモも更新する。

【確定した世界観・会話のルール】
・プレイヤーの「守り神さま」と、案内役の「カミサマ（わし・〜じゃ）」は別。
・家具・遊具・照明などは、せいれいが初めから名前や設計を知っているものではない。
・せいれいの願い／困りごと → 守り神のひらめき → 図案をもとにせいれいが作る → 初めて使って喜ぶ。
・使った後や教わった後は名前を知ってよい。植物・属性など自然についての知識とは区別する。
・最初の草原はフタバひとり。仲間がいない時点で「みんなで」などと話させない。
・火山の村も最初はホムラひとり。各エリアで仲間が加わる前の会話に、まだいない子を含めない。
・説明の復唱ではなく、感覚や気持ちを中心に話す。前後の会話・人数・知識も確認する。
・フタバは木／ぼく、ノドカは土／ぼく・〜だねぇ、ホムラは火／あたい、シズクは水／わたし・丁寧。
・コードの POKO はフタバ、MINA はノドカ。別キャラを指す古い名前と取り違えない。
・木火水土風の5属性。暮らしを育て、土地のヌシを迎える。未解決の謎の答えを勝手に確定しない。

【進行と操作の約束】
・村レベル目標は、仲間を迎える・村を広げる・防衛するなど実際の村づくりの間に分散させる。Lv待ちの目標を短い操作だけを挟んで連続させない。
・受注とお礼は吹き出しをタップして始める。達成演出から自動でお礼を開かない。
・設置目標では、対象の近くへ歩き、喜ぶモーションの開始と同時に完了吹き出しを出す。喜びは約2.4秒続く。
・ピンクの条件会話も、対象の物や相手のそばへ1.5倍速で集まり、到着してリアクションを始めた時に吹き出しを出す。会話はタップで始め、会話後は3時間あける。
・建物・植物は完成や植え付け後。空腹・敵・夜の危険・会話中は生活と安全を優先。瞬間移動させない。
・受注／報告完了でレシピを増やす。家具の発想・作成には村Lv条件を適用しない。家具レシピは関連クエストで覚えるが、じゅうたんとカーテンのみLv9の指定報酬として解放する。各レベル報酬は設定した一覧に限る。木・果樹などの個別の設置可能Lvとは区別する。取得済みの形は重複通知しない。
・村レベル達成クエストから家具レシピをひらめかせない。家具は内容に関連する依頼をきっかけにする。
・せいれいの経験値は従来の保存分を保ち、以後の獲得量を少し抑えてレベル上昇を緩やかにする。

【今のコードの書き方】
・ファイル：js/*.js（ゲームのプログラム。役目ごとに分けたふつうの script。index.html の読みこみの U の順に、あいだをあけずに動かす。どのファイルの関数・変数も、ほかのファイルから使える）、chips.js（ドット絵チップの場所だけ。window.CHIPA にアトラスの絵 assets/chips/*.webp、window.CHIPS に id→{ax,ay,w,h,f:[[ページ,x,y,w,h]]}。作るのは tools/chips.py）。プログラムの絵と音は assets/g、フォントは assets/f（どれも中身から作った名前）、index.html（画面のかたち・CSS）。ビルドはない。
・js/ のプログラムは1行に長く書く短い書き方。まわりと同じ書き方・同じ量のコメント（/* ひらがな多めの日本語 */）にそろえる。
・数字は実数でそのまま書く。倍率や計算で説明文の数字をつくらない。起動時に表の値を書きかえない。
・表（データ）：BL（物・建物・家具）、FOODS（食べ物。fx は説明文）、QUESTS（メイン）、SUBQ（サブ。k・g〔たのむ属性〕・L〔受ける会話〕・X〔お礼〕・at〔出る条件〕・ok〔たっせい〕・n/now〔進みぐあい〕・pay〔素材をわたす〕・how〔やりかた〕）、CHATS（おしゃべり。順番がセーブの話題番号になるので、とちゅうに足さない）、AFTERQ・DAILYG・FREEG（クリア後）。
・会話の行は [話す人, 文]。文の頭に '#joy|' のような印で顔・動き（LOOKS の表、lineLook で読む）。['@idea'] はひらめきの演出の位置。火の子の文は {h:ホムラ用, a:ほかの火の子用}。
・おしゃべりの口調は chatTone で属性ごとに言いかえる。言いかえを足したら、全部の文を属性ごとに書き出して、おかしな文にならないか見る。
・壁・柵・塀は CONN／connMask で、となりとのつながりから H0・HL・HR・HLR・VU・VD・VUD のチップを組みあわせる（drawConn）。ドア・門は DOORCH と drawDoorChip。
・セーブは S（localStorage）。形をかえるときは mig の移行を足す（newState の mig も上げる）。
・APP_VER は PR 番号にする。変更のあとは node --check js/*.js・chips.js と、ブラウザで起動してエラーが出ないことをたしかめる。
・毎コマの処理（stepWorld・updRes・描画）に、一覧づくりやマス全体のくりかえしを足さない。
