作業ルールは CLAUDE.md、世界の設定（ヌシ様・コワイノの正体・さいごの章）は STORY.md を読む。
最新のユーザー指示で設定が変わったら、このメモも更新する。

【確定した世界観・会話のルール】
・プレイヤーの「守り神さま」と、案内役の「カミサマ（わし・〜じゃ）」は別。
・家具・遊具・照明などは、せいれいが初めから名前や設計を知っているものではない。
・せいれいの願い／困りごと → 守り神のひらめき → 図案をもとにせいれいが作る → 初めて使って喜ぶ。
・使った後や教わった後は名前を知ってよい。植物・属性など自然についての知識とは区別する。
・最初の草原はフタバひとり。仲間がいない時点で「みんなで」などと話させない。
・火山の村も最初はホムラひとり。各エリアで仲間が加わる前の会話に、まだいない子を含めない。
・説明の復唱ではなく、感覚や気持ちを中心に話す。前後の会話・人数・知識も確認する。
・フタバは木／ぼく、ノドカは土／ぼく・〜だねぇ、ホムラは火／あたい、シズクは水／わたし・丁寧。
・コードの POKO はフタバ、MINA はノドカ。別キャラを指す古い名前と取り違えない。
・木火水土風の5属性。暮らしを育て、土地のヌシを迎える。未解決の謎の答えを勝手に確定しない。

【進行と操作の約束】
・村レベル目標は、仲間を迎える・村を広げる・防衛するなど実際の村づくりの間に分散させる。Lv待ちの目標を短い操作だけを挟んで連続させない。
・受注とお礼は吹き出しをタップして始める。達成演出から自動でお礼を開かない。
・設置目標では、対象の近くへ歩き、喜ぶモーションの開始と同時に完了吹き出しを出す。喜びは約2.4秒続く。
・ピンクの条件会話も、対象の物や相手のそばへ1.5倍速で集まり、到着してリアクションを始めた時に吹き出しを出す。会話はタップで始め、会話後は3時間あける。
・建物・植物は完成や植え付け後。空腹・敵・夜の危険・会話中は生活と安全を優先。瞬間移動させない。
・受注／報告完了でレシピを増やす。家具の発想・作成には村Lv条件を適用しない。家具レシピは関連クエストで覚えるが、じゅうたんとカーテンのみLv9の指定報酬として解放する。各レベル報酬は設定した一覧に限る。木・果樹などの個別の設置可能Lvとは区別する。取得済みの形は重複通知しない。
・村レベル達成クエストから家具レシピをひらめかせない。家具は内容に関連する依頼をきっかけにする。
・せいれいの経験値は従来の保存分を保ち、以後の獲得量を少し抑えてレベル上昇を緩やかにする。
・火の仲間を迎えるメイン目標を受注したら、サルビア5本・見張り台合計2つの依頼を順に案内する。どちらも火の仲間を呼ぶ条件にはしない。花の属性値は種類ごとに1。属性値は依頼の受注状況にかかわらず、基地に置いた物の分を常に蓄積して召喚判定に使う。
・基地拡張はなくした（敷地なし）。カミサマの像は、水のせいれいが来た後に発想する。
・精霊どうしの会話で家具・遊具・施設に触れるときは、実際に置かれてから話題にする。別属性ごとの会話にも条件を適用する。
・敵はストーリーの序盤ではゆっくり増やし、強い種類とオオカゲ撃破後の増援も段階的に出す。その夜のコワイノ全員を朝4時までに到着させる。ワナクイは罠設置でなく進行度に合わせる。
・収納は「収納」、遊具は「遊び」。依頼ボード・置く一覧・おそなえ箱の分類をそろえる。
・上部UIの折り返しとsafe-area、画面幅に合う指ガイドを維持する。
・開始画面に「10秒ごとに自動セーブ」「音が出ます」の案内を再追加しない。機能は残す。
・村レベルはLv10が上限。レベル報酬はLv2 あぜ道・柵のドア、Lv3 木の壁・ドア、Lv4 フローリング・窓、Lv5 しっくいの壁・砂利道、Lv6 石の塀・石の塀のドア、Lv7 丸太の壁、Lv8 レンガ道・レンガ壁、Lv9 じゅうたん・カーテン、Lv10 石畳・石の大門。丸太の柵・小さな家は新規作成と報酬から除く。竹の柵・石の柵も新規一覧から除く。

【現実装と拡張時の注意】
・通常エリアの内部IDは草原0／火山1。予告のみの水2／土3／風4／神々の庭5。フリーは6。
・未実装エリアの登場人物・ヌシ・事件・結末は未確定。予告があることと実装済みであることは別。
・現在は localStorage 保存。クラウド同期なし。JSON書き出し／読み込みあり。URLを変えると保存先も変わる。
・状態 v:8／クエスト移行 qVer:35。SAVE_KEYS、S.quest、qStory、subDone、recipes を引き継ぐ。
・クエスト順や表示文言は関連マップと保存移行にも影響する。新エリア用の保存キーを用意する。
・風の仲間 → 5属性が必要な台座の順。解放に循環依存を作らない。タブ番号を固定しない。
・objectDepth により足元で重ねる。複数マスと地面チップの描き直しを混同しない。
・現公開先はSites。GitHub Pagesではない。開発資料に認証情報を書かない。
このメモは開発資料。新しいユーザー指示・実装変更に合わせ、詳細資料と一緒に保守する。
収納の用途：普通の棚・木箱・かべ棚は素材、ひくい棚・キャビネットは食料。容量と運搬先を共通定義STORAGEで扱う。
守り神のひらめきには未公開の由来がある。制作側の真相と登場人物の知識はdocs/WORLD_BIBLE.mdを参照。ゲームに守り神の心情・独白・内面の地の文を入れない。カミサマが形を見て「それは……」と反応する間でほのめかす。カミサマも真相は知らず、形への反応と由来の理解を区別する。
道は4方向に接続し、外周だけに素材に合う縁を描く（砂利道と土の道には隣接する地面色の草・土が密に不規則に入り込む縁（硬い縁なし）、石だたみは幅広の石、レンガ道は幅広のレンガ（目地は狭く））。へこんだ内角は斜め隣も確認して素材に合うコーナーを描く。広場の内部にタイルの縁や隙間を作らない。
カミサマがプレイヤーに呼びかける二人称は「おヌシ」。「守り神さま」「そなた」と呼ばない。せいれいの呼称とは分ける。
新しい図案はideaDialogueで願いとカミサマの反応の間に光・図案の演出を挟む。守り神の心情は語らず、つづけるのタップ後に会話へ戻る。
会話の顔・動き・間は、セリフの文に書いた印（例 #joy|）とLOOKSの表で決める（文字から推測しない）。dialoguePoseで動き、dialoguePauseで句読点の間を入れる。自動では次の台詞へ進めず、連打で動きや余韻を飛ばさない。
緑地と荒地の境界はdrawGrassBoundaryで道の縁に似た草・土のまだらな入り込みを描き、端は丸くつないで角を作らない。緑地内部・水辺には適用しない。
会話の全身立ち絵はdialogueSpiritAnimとdrawSpiritのtalk系で腕・姿勢も動かす。台詞後は待機へ戻す。
セリフの印は、恐怖・襲撃・悲しみの場面では、よろこびより先にそれを選ぶ。号泣顔は使わず、強い悲しみも両目をうるませる。片目の涙は台詞の流れに合わせて使う。食卓は葉を使う案と風で飛ぶ問題を挟んでから「土がつかず風にも飛ばされない場所」へ発想をつなげる。
ゲームのプログラムは game.js（index.html は画面のかたちと見た目だけ。最初の文字をすぐ出すため分けている）。公開時に ?v= はコミットごとに自動で書きかわる。

【これからのステージの予定】（ユーザーの希望。まだ作っていない）
・水の子のステージ：効率化・自動化についての、いろいろな物をふやせるようにする（運ぶ・あつめる・そだてるの手間をへらす物など）。
・風の子のステージ：いろいろな遊びアイテムをおぼえられるようにする。遊園地を作ることを、ひとつの大きな目標にする。

【今のコードの書き方】
・ファイル：game.js（ゲームのすべて）、chips.js（ドット絵チップの場所だけ。window.CHIPA にアトラスの絵 assets/chips/*.webp、window.CHIPS に id→{ax,ay,w,h,f:[[ページ,x,y,w,h]]}。作るのは tools/chips.py）。game.js の絵と音は assets/g、フォントは assets/f（どれも中身から作った名前）、index.html（画面のかたち・CSS）。ビルドはない。
・game.js は1行に長く書く短い書き方。まわりと同じ書き方・同じ量のコメント（/* ひらがな多めの日本語 */）にそろえる。
・数字は実数でそのまま書く。倍率や計算で説明文の数字をつくらない。起動時に表の値を書きかえない。
・表（データ）：BL（物・建物・家具）、FOODS（食べ物。fx は説明文）、QUESTS（メイン）、SUBQ（サブ。k・g〔たのむ属性〕・L〔受ける会話〕・X〔お礼〕・at〔出る条件〕・ok〔たっせい〕・n/now〔進みぐあい〕・pay〔素材をわたす〕・how〔やりかた〕）、CHATS（おしゃべり。順番がセーブの話題番号になるので、とちゅうに足さない）、AFTERQ・DAILYG・FREEG（クリア後）。
・会話の行は [話す人, 文]。文の頭に '#joy|' のような印で顔・動き（LOOKS の表、lineLook で読む）。['@idea'] はひらめきの演出の位置。火の子の文は {h:ホムラ用, a:ほかの火の子用}。
・おしゃべりの口調は chatTone で属性ごとに言いかえる。言いかえを足したら、全部の文を属性ごとに書き出して、おかしな文にならないか見る。
・壁・柵・塀は CONN／connMask で、となりとのつながりから H0・HL・HR・HLR・VU・VD・VUD のチップを組みあわせる（drawConn）。ドア・門は DOORCH と drawDoorChip。
・セーブは S（localStorage）。形をかえるときは mig の移行を足す（newState の mig も上げる）。
・APP_VER は PR 番号にする。変更のあとは node --check game.js・chips.js と、ブラウザで起動してエラーが出ないことをたしかめる。
・毎コマの処理（stepWorld・updRes・描画）に、一覧づくりやマス全体のくりかえしを足さない。
END HAKONIWA DEVELOPMENT NOTES -->

/* 端末の表示幅・セーフエリア内でHUDを組み直す。 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;width:100%;min-width:0}
.top,.bottom,.hud,.stock,.stk,.qrow,.quest,.alert,.qhow{box-sizing:border-box;min-width:0}
.top,.bottom{max-width:100%}
.hud{width:min(100%,640px);gap:8px;overflow-wrap:anywhere}
.clock,.lvb{flex-wrap:wrap;min-width:0;max-width:100%}

.idea-symbol{font-size:48px;filter:drop-shadow(0 0 16px #ffce56);animation:idea-float 2s ease-in-out infinite}.idea-card h2{font-size:clamp(22px,6vw,30px);margin:12px 0 18px;color:#a06620}.idea-items{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;max-height:45dvh;overflow:auto}.idea-item{display:grid;justify-items:center;gap:6px;min-width:90px;padding:10px;border:1px dashed #c4a66b;border-radius:12px;background:linear-gradient(90deg,#e5d8ad33 1px,transparent 1px),linear-gradient(#e5d8ad33 1px,transparent 1px),#fffdf1;background-size:12px 12px;animation:idea-pop .6s .25s both}.idea-item img{width:72px;height:72px;object-fit:contain}.idea-item span{font-size:14px}.idea-item small{font-size:11px;color:#8a7350}.idea-card button{margin-top:22px;min-width:160px;min-height:46px}.idea-spark{position:absolute;left:50%;top:45%;font-size:clamp(16px,4vw,30px);color:#ffedaa;animation:idea-spark 2.8s ease-out both;pointer-events:none;text-shadow:0 0 12px #fff}

.hud,.dock,.quest,#speedBtn,#skipBtn,.sheet,.dlg::before,.toast,.btn,.slot,.paper,.ctab,.qbtn,#helpPop .hc,.idea-card,.askyn .ak,#lvup .card,#rlv .rcard,.iinfo,#confirm,#palette,.wcard,.idea-item,.mtile,.godSay,.chip,.pxcard,#undoBtn,#idle .card,.palA{--pp:1.5px;border-radius:0!important;border-style:solid!important;border-color:transparent!important;border-width:var(--pp)!important;border-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2211%22%20height%3D%2211%22%20viewBox%3D%220%200%2011%2011%22%20shape-rendering%3D%22crispEdges%22%3E%3Cpath%20d%3D%22M4%201h3v1h-3zM2%202h7v1h-7zM2%203h7v1h-7zM1%204h9v1h-9zM1%205h9v1h-9zM1%206h9v1h-9zM2%207h7v1h-7zM2%208h7v1h-7zM4%209h3v1h-3z%22%20fill%3D%22%23f4e9d2%22%2F%3E%3Cpath%20d%3D%22M4%200h3v1h-3zM2%201h2v1h-2zM7%201h2v1h-2zM1%202h1v1h-1zM9%202h1v1h-1zM1%203h1v1h-1zM9%203h1v1h-1zM0%204h1v1h-1zM10%204h1v1h-1zM0%205h1v1h-1zM10%205h1v1h-1zM0%206h1v1h-1zM10%206h1v1h-1zM1%207h1v1h-1zM9%207h1v1h-1zM1%208h1v1h-1zM9%208h1v1h-1zM2%209h2v1h-2zM7%209h2v1h-2zM4%2010h3v1h-3z%22%20fill%3D%22%23a8743f%22%2F%3E%3C%2Fsvg%3E") 5 fill / calc(var(--pp)*5) stretch!important;background:none!important;box-shadow:none!important}
.btn,.slot,.ctab,.qbtn,.paper{--pp:1px}

(function(){var U=["chips.js?v=dev","game.js?v=dev"],E=[95000,1000000],L=[0,0],T=[0,0],X=[null,null],ran=0,want=0,b=document.getElementById('tStart'),m=document.getElementById('tLoad');
