# Encoding is chosen here, at build time, and the proxy adds none. The build
# writes index.html.br (brotli 11) and index.html.gz beside the page; stock
# nginx:alpine has no brotli module, so the files are handed over as they are.
map $http_accept_encoding $frost_enc {
    default    "";
    "~*\bbr\b" "br";     # br first: "gzip, deflate, br" matches both
    "~*\bgzip\b" "gzip";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The page is one unminified file. Precompression takes it to about 590 KB.
    location = / {
        add_header Vary Accept-Encoding always;
        if ($frost_enc = "br")   { rewrite ^ /.br last; }
        if ($frost_enc = "gzip") { rewrite ^ /.gz last; }
        try_files /index.html =404;
    }

    # Internal: reached by the rewrites above only. A build that skipped
    # precompression falls back to @identity, which sends the plain page with no
    # Content-Encoding. The header is set in the same block as the encoded file,
    # so the fallback cannot carry it.
    location = /.br {
        internal;
        default_type text/html;
        add_header Content-Encoding br always;
        add_header Vary Accept-Encoding always;
        try_files /index.html.br @identity;
    }
    location = /.gz {
        internal;
        default_type text/html;
        add_header Content-Encoding gzip always;
        add_header Vary Accept-Encoding always;
        try_files /index.html.gz @identity;
    }
    location @identity {
        add_header Vary Accept-Encoding always;
        try_files /index.html =404;
    }

    # esbuild fingerprints each track, so a URL changes when its bytes do.
    # MP3 is already compressed.
    location /audio/ {
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
