app = 'project-frostwind'
primary_region = 'arn'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # A static page with no state behind it: the machine may sleep between
  # visitors and cold-start on the next request.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
