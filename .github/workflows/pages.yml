name: Publish Hakoniwa to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # GitHub 公式のひな形と同じく、作るジョブと公開するジョブを分ける（同じジョブで、上げた直後に公開すると、上げたファイルがまだ一覧に出ていなくて落ちた）
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare site from committed files
        run: |
          mkdir -p _site/assets
          cp index.html chips.js sw.js .nojekyll _site/
          cp -R js _site/js
          node tools/minify.cjs _site
          for f in _site/chips.js _site/js/*.js; do node --check "$f" || exit 1; done
          node tools/jsver.cjs _site
          node tools/sizes.cjs _site
          cp -R assets/. _site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publish:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
